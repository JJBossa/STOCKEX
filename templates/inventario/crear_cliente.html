{% extends 'base.html' %}
{% block title %}Crear cliente - STOCKEX{% endblock %}
{% block content %}
<section class="mx-auto" style="max-width: 44rem">
    <h1 class="h3 mb-3">Crear cliente</h1>
    <form method="post" class="card">
        <div class="card-body">
            {% csrf_token %}
            <input type="hidden" name="clave_alta" value="{{ clave_alta }}">
            {% include 'inventario/fiados/campos_cliente.html' %}
            <details class="my-3">
                <summary>Otros datos opcionales</summary>
                <label class="form-label mt-2" for="alta-tipo">Tipo de cliente</label>
                <select class="form-select" id="alta-tipo" name="tipo_cliente">
                    <option value="natural">Persona natural</option>
                    <option value="empresa" {% if datos.tipo_cliente == 'empresa' %}selected{% endif %}>Empresa</option>
                </select>
                <label class="form-label mt-2" for="alta-direccion">Dirección</label>
                <input class="form-control" id="alta-direccion" name="direccion" value="{{ datos.direccion }}">
                <label class="form-label mt-2" for="alta-contacto">Persona de contacto</label>
                <input class="form-control" id="alta-contacto" name="contacto" maxlength="200" value="{{ datos.contacto }}">
            </details>
            <button class="btn btn-primary" type="submit">Crear cliente</button>
            <a href="{% url 'listar_clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
